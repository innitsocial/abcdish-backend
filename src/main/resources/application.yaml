spring:
  application:
    name: abcdish-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  jackson:
    serialization:
      indent-output: true

  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_FILE_SIZE:100MB}
      max-request-size: ${MAX_UPLOAD_REQUEST_SIZE:100MB}

  flyway:
    enabled: true
    schemas: abcdish
    default-schema: abcdish
    baseline-on-migrate: true
    baseline-version: 0

server:
  port: ${SERVER_PORT:8080}

app:
  seed:
    recipe-ideas:
      reset: ${APP_SEED_RECIPE_IDEAS_RESET:false}
  jwt:
    secret: ${JWT_SECRET:abcdish-local-dev-secret-key-must-be-at-least-32-characters}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  media:
    storage-path: ${MEDIA_STORAGE_PATH:uploads/media}
    provider: ${APP_MEDIA_PROVIDER:local}
    public-base-url: ${MEDIA_PUBLIC_BASE_URL:}
    r2:
      endpoint: ${R2_ENDPOINT:}
      bucket: ${R2_BUCKET:}
      access-key-id: ${R2_ACCESS_KEY_ID:}
      secret-access-key: ${R2_SECRET_ACCESS_KEY:}
      region: ${R2_REGION:auto}
  ai:
    recipe-extraction:
      enabled: ${AI_RECIPE_EXTRACTION_ENABLED:true}
    openai:
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:gpt-4.1-mini}
      image-model: ${OPENAI_IMAGE_MODEL:gpt-image-1}
      video-model: ${OPENAI_VIDEO_MODEL:sora-2}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    recipe-generation:
      enabled: ${AI_RECIPE_GENERATION_ENABLED:false}
      limit: ${AI_RECIPE_GENERATION_LIMIT:10}
      generate-images: ${AI_RECIPE_GENERATE_IMAGES:true}
      generate-videos: ${AI_RECIPE_GENERATE_VIDEOS:false}

  oauth:
    base-authorization-url: ${OAUTH_BASE_AUTHORIZATION_URL:/oauth2/authorization}
  notifications:
    email:
      provider: ${EMAIL_PROVIDER:console}
      from: ${OTP_EMAIL_FROM:no-reply@abcdish.com}
      resend:
        api-key: ${RESEND_API_KEY:}
