spring:
  application:
    name: abcdish-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  jackson:
    serialization:
      indent-output: true

  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_FILE_SIZE:100MB}
      max-request-size: ${MAX_UPLOAD_REQUEST_SIZE:100MB}

  flyway:
    enabled: true
    schemas: abcdish
    default-schema: abcdish
    baseline-on-migrate: true
    baseline-version: 0

server:
  port: ${SERVER_PORT:8080}

app:
  seed:
    recipe-ideas:
      reset: ${APP_SEED_RECIPE_IDEAS_RESET:false}
      publish-ready-to-feed: ${APP_SEED_RECIPE_IDEAS_PUBLISH_READY_TO_FEED:true}
      publish-all-to-feed: ${APP_SEED_RECIPE_IDEAS_PUBLISH_ALL_TO_FEED:true}
      reset-categories: ${APP_SEED_RECIPE_IDEAS_RESET_CATEGORIES:false}
    sample-feed:
      enabled: ${APP_SEED_SAMPLE_FEED_ENABLED:false}
      reset: ${APP_SEED_SAMPLE_FEED_RESET:false}
  jwt:
    secret: ${JWT_SECRET:abcdish-local-dev-secret-key-must-be-at-least-32-characters}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  cache:
    redis:
      enabled: ${REDIS_ENABLED:false}
      url: ${REDIS_URL:}
      key-prefix: ${REDIS_KEY_PREFIX:abcdish}
    ttl:
      feed-seconds: ${CACHE_TTL_FEED_SECONDS:45}
      categories-seconds: ${CACHE_TTL_CATEGORIES_SECONDS:3600}
      meals-seconds: ${CACHE_TTL_MEALS_SECONDS:300}
      meal-detail-seconds: ${CACHE_TTL_MEAL_DETAIL_SECONDS:600}
  jobs:
    worker:
      enabled: ${JOBS_WORKER_ENABLED:true}
      batch-size: ${JOBS_WORKER_BATCH_SIZE:5}
      fixed-delay-ms: ${JOBS_WORKER_FIXED_DELAY_MS:5000}
      max-attempts: ${JOBS_WORKER_MAX_ATTEMPTS:5}
  media:
    storage-path: ${MEDIA_STORAGE_PATH:uploads/media}
    provider: ${APP_MEDIA_PROVIDER:local}
    public-base-url: ${MEDIA_PUBLIC_BASE_URL:}
    r2:
      endpoint: ${R2_ENDPOINT:}
      bucket: ${R2_BUCKET:}
      access-key-id: ${R2_ACCESS_KEY_ID:}
      secret-access-key: ${R2_SECRET_ACCESS_KEY:}
      region: ${R2_REGION:auto}
  ai:
    recipe-extraction:
      enabled: ${AI_RECIPE_EXTRACTION_ENABLED:true}
    openai:
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:gpt-4.1-mini}
      image-model: ${OPENAI_IMAGE_MODEL:gpt-image-1}
      video-model: ${OPENAI_VIDEO_MODEL:sora-2}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    recipe-generation:
      enabled: ${AI_RECIPE_GENERATION_ENABLED:false}
      limit: ${AI_RECIPE_GENERATION_LIMIT:10}
      generate-images: ${AI_RECIPE_GENERATE_IMAGES:true}
      generate-videos: ${AI_RECIPE_GENERATE_VIDEOS:false}
    recipe-detail-generation:
      enabled: ${AI_RECIPE_DETAIL_GENERATION_ENABLED:false}
      limit: ${AI_RECIPE_DETAIL_GENERATION_LIMIT:10}
      model: ${AI_RECIPE_DETAIL_MODEL:gpt-4.1-mini}

  oauth:
    base-authorization-url: ${OAUTH_BASE_AUTHORIZATION_URL:/oauth2/authorization}
  notifications:
    email:
      provider: ${EMAIL_PROVIDER:console}
      from: ${OTP_EMAIL_FROM:no-reply@abcdish.com}
      resend:
        api-key: ${RESEND_API_KEY:}
