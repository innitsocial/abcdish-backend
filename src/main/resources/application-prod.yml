spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          connectiontimeout: ${SMTP_CONNECTION_TIMEOUT_MS:5000}
          timeout: ${SMTP_READ_TIMEOUT_MS:5000}
          writetimeout: ${SMTP_WRITE_TIMEOUT_MS:5000}
          starttls:
            enable: ${SMTP_STARTTLS_ENABLE:true}

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}

    show-sql: false

    properties:
      hibernate:
        format_sql: false
        default_schema: abcdish

logging:
  file:
    name: ${LOG_FILE:logs/abcdish-backend.log}
  level:
    root: info
    com.innitsocial.abcdish: info
    org.hibernate.SQL: warn
    org.hibernate.orm.jdbc.bind: warn
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{correlationId}] %logger{36} - %msg%n"
    console: "%d{HH:mm:ss} %-5level [%X{correlationId}] %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never

app:
  notifications:
    email:
      enabled: ${EMAIL_OTP_ENABLED:false}
      provider: ${EMAIL_PROVIDER:console}
      from: ${OTP_EMAIL_FROM:no-reply@abcdish.com}
      resend:
        api-key: ${RESEND_API_KEY:}
